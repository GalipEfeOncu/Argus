name: Supply chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Source ref to audit
        required: false
        type: string

permissions:
  contents: read

env:
  UV_VERSION: 0.11.28
  PYTHON_VERSION: '3.12'
  NODE_VERSION: 24.18.1

jobs:
  audit:
    name: Locked dependencies, SBOM, licenses, and vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
      - run: npm ci
      - run: uv sync --project backend --all-extras --frozen
      - run: uv run --project backend --all-extras python scripts/supply_chain.py licenses artifacts/licenses.json
      - run: python scripts/supply_chain.py sbom artifacts/argus.cdx.json
      - run: npm audit --audit-level=high --json > artifacts/npm-audit.json
      - run: uv run --project backend --all-extras --with pip-audit==2.10.1 pip-audit --skip-editable --format=json --output=artifacts/pip-audit.json
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --json > ../artifacts/cargo-audit.json
        working-directory: src-tauri
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
      - name: Record audited source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-evidence-${{ steps.source.outputs.commit }}
          if-no-files-found: error
          path: |
            artifacts/argus.cdx.json
            artifacts/licenses.json
            artifacts/*-audit.json

  reproducible-frontend:
    name: Reproducible clean frontend build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: build-a
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: build-b
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci && npm run build
        working-directory: build-a
      - run: npm ci && npm run build
        working-directory: build-b
      - run: python build-a/scripts/supply_chain.py compare-builds build-a/dist build-b/dist
